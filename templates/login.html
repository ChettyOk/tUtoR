{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ site_name }}</title>
  <meta name="theme-color" content="#004f2e">
  <link rel="icon" href="{% static 'img/logo-only.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/landing.css' %}">
</head>
<body>
  <header class="navbar sticky-top site-header">
    <div class="container">
      <a class="navbar-brand py-0" href="{% url 'landing' %}">
        <img src="{% static 'img/tutor-logo.svg' %}" alt="{{ site_name }}" width="148" height="46">
      </a>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <article class="card">
            <div class="card-body p-4 p-md-5">
              <p class="kicker kicker-green">Students and tutors</p>
              <h1 class="h2">Sign in</h1>
              <p class="card-text mt-3">This is where a student or a tutor will sign in. The form is not connected yet.</p>
              <p class="mt-3 mb-0"><a href="{% url 'request_forgotten_password' %}">Forgot your password?</a></p>
              <a class="btn btn-green rounded-pill mt-4" href="{% url 'landing' %}">Back to tUtoR</a>
            </div>
          </article>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
